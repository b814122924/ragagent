# =====================================================================
# SmartBrief 前端 nginx 配置
# 1. 静态托管：Vue 构建产物（/usr/share/nginx/html）
# 2. API 反代：/api/* 转发到后端容器（backend 为 compose 服务名，走容器内网）
#    proxy_pass 不带尾路径 → 保留 /api 前缀，后端收到 /api/v1/... 原样路由
# 3. SPA 回退：history 模式路由刷新时不 404，统一回 index.html
# =====================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端静态资源（带基础缓存头）
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # API 反向代理到后端（任务/评测为长请求，放宽读超时）
    location /api/ {
        proxy_pass http://backend:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA 路由回退（如 /tasks/xxx 直接刷新）
    location / {
        try_files $uri $uri/ /index.html;
    }
}